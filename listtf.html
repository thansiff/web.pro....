<html>
<head>
<title>HTML Lists</title>
</head>
<body bgcolor="light blue">
<h1>Types of lists in html</h1>
<h2>1.Ordered list</h2>
<ol>
<li>apple</li>
<li>banana</li>
<li>orange</li>
<li>mango</li>
</ol>
<h2>2.unordered list</h2>
<ul>
<li>red</li>
<li>green</li>
<li>blue</li>
<li>yellow</li>
</ul>
<h2>3.description list</h2>
<dl>
<dt>HTML</dt>
<dd>hyper text markup language</dd>
<dt>CSS</dt>
<dd>Cascading Style Sheets</dd>
<dt>JavaScript</dt>
<dd>A scripting language used to make web pages interactive.</dd>
</dl>
</body>
</html>
